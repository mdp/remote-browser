services:
  chrome:
    image: kasmweb/chrome:1.19.0
    container_name: browser-chrome
    # Keep the original profile hostname: Chrome stores it in SingletonLock.
    hostname: hermes-chrome
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "2gb"
    environment:
      VNC_PW: ${VNC_PASSWORD:?Set VNC_PASSWORD in browser/.env}
      APP_ARGS: >-
        --user-data-dir=/tmp/chrome-debug
        --remote-debugging-port=9222
        --remote-allow-origins=*
        --start-maximized
      LAUNCH_URL: about:blank
    volumes:
      - "${BROWSER_DATA_DIR:-./data}/config:/home/kasm-user/.config:rw"
      - "${BROWSER_DATA_DIR:-./data}/profile:/tmp/chrome-debug:rw"
      - "${BROWSER_DATA_DIR:-./data}/Downloads:/home/kasm-user/Downloads:rw"
      - "${BROWSER_DATA_DIR:-./data}/vnc:/home/kasm-user/.vnc:rw"
    ports:
      # KasmVNC serves HTTPS on 6901. Bind only localhost and the tailnet IP.
      - "127.0.0.1:${KASM_PORT:-6901}:6901"
      - "${TAILSCALE_IP:?Set TAILSCALE_IP in browser/.env}:${KASM_PORT:-6901}:6901"
      # The CDP forwarder below listens on 9223 inside this shared network
      # namespace. Never publish this unauthenticated endpoint beyond loopback.
      - "127.0.0.1:${CDP_HOST_PORT:-9222}:9223"

  cdp-forward:
    image: kasmweb/chrome:1.19.0
    container_name: browser-cdp-forward
    restart: unless-stopped
    network_mode: "service:chrome"
    entrypoint: ["python3", "/cdp-forward.py"]
    environment:
      CDP_LISTEN_PORT: "9223"
      CDP_TARGET_HOST: "127.0.0.1"
      CDP_TARGET_PORT: "9222"
    volumes:
      - ./cdp-forward.py:/cdp-forward.py:ro
    depends_on:
      - chrome
